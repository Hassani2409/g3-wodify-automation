name: Docker Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: g3-wodify-automation:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker image
      run: |
        docker run -d --name test-container -p 8000:8000 \
          -e WODIFY_WEBHOOK_SECRET=test \
          -e SENDGRID_API_KEY=test \
          -e JWT_SECRET_KEY=test-jwt-secret-key-min-32-characters \
          g3-wodify-automation:latest
        
        # Wait for readiness, retaining logs if the process exits early.
        for attempt in $(seq 1 30); do
          if curl --silent --fail http://localhost:8000/webhooks/health; then
            exit 0
          fi
          sleep 2
        done
        docker logs test-container
        exit 1

    - name: Container diagnostics and cleanup
      if: always()
      run: |
        docker logs test-container 2>&1 || true
        docker rm -f test-container || true
